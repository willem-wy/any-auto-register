services:
  any-auto-register:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: any-auto-register:slim
    container_name: any-auto-register
    restart: unless-stopped
    # 仅绑定 Netbird 接口，公网 / 局域网不可达
    ports:
      - "100.72.224.180:18000:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?请在 .env 中设置 APP_PASSWORD}
      ACCOUNT_MANAGER_DATABASE_URL: sqlite:////app/data/account_manager.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
